  <h1>Eino 文档处理流程</h1>
  <p>文档处理分为三步：Loader 负责读取原始数据，Parser 负责把字节解析成文本，Transformer 负责把长文本切成小块。</p>
  <p>切好的文档块经过 Embedding 变成向量，再由 Indexer 写入向量库，最后由 Retriever 按问题检索。</p>
